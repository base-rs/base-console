[package]
name = "core-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/core-rs/core-console"
documentation = "https://docs.rs/core-console"
description = "Automatic terminal and JSON diagnostics for tracing"
keywords = ["logging", "tracing", "console", "diagnostics"]
categories = ["development-tools::debugging"]
readme = "readme.md"
include = ["src/**", "context/**", "design/**", "examples/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["core-rs/maintainers"]

[dependencies]
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-error = "0.2.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
futures-lite = "2"
log = "0.4"

